
name: StarryDreamsLand Veo Animation Test

on:
  workflow_dispatch:

jobs:
  animate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gemini SDK
        run: python -m pip install --upgrade google-genai

      - name: Generate first animated scene
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python animate_scene.py

      - name: Save animation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: felix-bella-first-animation
          path: felix_bella_animation.mp4
          if-no-files-found: warn
          retention-days: 7
