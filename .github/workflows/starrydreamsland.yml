
name: StarryDreamsLand Animated Story

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install video and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Create English narration
        run: |
          espeak-ng -v en-us -s 135 -w voice.wav \
            "Once upon a time, a little star lost its glow. \
            Fox and Bunny searched the magical sky. \
            They shared kindness and friendship. \
            Suddenly, the star began to shine again! \
            And everyone lived happily under the stars."

      - name: Create animated video
        run: |
          ffmpeg -y \
            -loop 1 -framerate 24 \
            -i characters.png \
            -i voice.wav \
            -filter_complex "[0:v]scale=900:1600:force_original_aspect_ratio=increase,crop=900:1600,zoompan=z='min(zoom+0.0004,1.15)':d=720:s=720x1280:fps=24,format=yuv420p[v];[1:a]apad[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset ultrafast \
            -c:a aac -b:a 128k \
            -t 30 -movflags +faststart \
            starrydreamsland-story.mp4

      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: starrydreamsland-animated-story
          path: starrydreamsland-story.mp4
          retention-days: 7
