
name: StarryDreamsLand AI Images

on:
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_story.py

      - name: Generate six AI images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_images.py

      - name: Save story and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starrydreamsland-six-scenes
          path: |
            story.json
            scenes/
          if-no-files-found: warn
          retention-days: 7
